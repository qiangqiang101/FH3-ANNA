name: Release

# Builds ANNA.dll and attaches it to the release: ANNA-<tag>.zip (extract next to azimuth.exe) and
# fh3anna.h (for mod makers). Run it by hand (Actions > Release > Run workflow) for a test build;
# the zip is then an artifact of the run.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install LLVM-MinGW
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip' -OutFile $archive
          if ((Get-FileHash $archive).Hash -ne 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd') {
            throw 'LLVM-MinGW archive checksum mismatch'
          }
          Expand-Archive $archive $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP 'llvm-mingw-20261020-ucrt-x86_64/bin' >> $env:GITHUB_PATH

      - name: Build
        shell: bash
        run: |
          mod="dist/package/mods/Forza Horizon 3/ANNA"
          mkdir -p "$mod/plugins"
          sh build.sh "$mod/plugins/ANNA.dll"
          # The scroll arrows' control (HUDAnnaControl.xaml) goes beside plugins.
          cp -r media "$mod/media"
          # ANNA writes ANNA.ini on her first start (with the settings FH3_ExtraOptions.ini [Vehicle] had).

      - name: Package
        shell: pwsh
        run: |
          $tag = if ('${{ github.event.release.tag_name }}') { '${{ github.event.release.tag_name }}' } else { 'dev' }
          $zip = "dist/ANNA-$tag.zip"
          Compress-Archive -Path dist/package/mods -DestinationPath $zip
          Copy-Item include/fh3anna.h dist/
          "ZIP=$zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ANNA
          path: |
            ${{ env.ZIP }}
            dist/fh3anna.h
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ZIP" dist/fh3anna.h --clobber --repo "${{ github.repository }}"
